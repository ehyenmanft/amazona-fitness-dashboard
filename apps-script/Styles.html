<style>

    --bg-card: #ffffff;
    --bg-card-hover: #f1f5f9;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --border-light: rgba(0, 0, 0, 0.06);
    --accent: #e11d48;
    --accent-hover: #f43f5e;
    --accent-soft: rgba(225, 29, 72, 0.1);
    --accent-subtle: rgba(225, 29, 72, 0.05);

    --primary-soft: rgba(15, 59, 102, 0.1);

    font-size: 11px;
    font-weight: 800;

  .brand-block {

  .brand-name {

    font-weight: 700;

  .renewal-client {

    font-weight: 800;
    color: var(--text-primary);

  .renewal-date {

    font-size: 22px;

    color: var(--accent);

    color: var(--warn);

  .renewal-card.expired .renewal-status {

    color: var(--bad);

    font-weight: 800;

    text-transform: uppercase;

  .value {

    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);

    margin-top: 14px;

    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 14px;

  .client-summary-head {

    padding-bottom: 8px;
    margin-bottom: 10px;

  .client-summary-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
  }
  .client-summary-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .client-summary-grid {
    display: grid;
    gap: 8px;
  }
  .client-metric-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;

  }
  .client-metric-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);

    margin-top: 14px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 14px;

  .client-drive-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .client-drive-title {
    font-size: 13px;
    font-weight: 800;
  }
  .client-drive-count {
    font-size: 11px;
    color: var(--text-muted);
  }

  .client-drive-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .drive-tab {
    flex: 1;
    padding: 6px;
    font-size: 11px;
    text-align: center;
  }

  .drive-link-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);

  .drive-link-title {

  .drive-link-meta {

  .drive-link-action {

    font-weight: 700;
  }

  .md-item {

    border: 1px solid var(--border-color);

  }

  .viewer {
    background-color: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    min-height: 820px;

    overflow: hidden;
  }

  .viewer-head {
    padding: 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background-color: var(--bg-card);

  #viewerTitle {
    font-size: 20px;
    font-weight: 800;
    display: block;
  }
  #viewerMeta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;

  #viewerLinks a {

    padding: 6px 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }

  .viewer-body {
    padding: 20px;
    flex: 1;
    overflow-y: auto;
  }

  .data-toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .data-nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .nav-pill {
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 999px;
  }

  /* Section Cards inside Plan */
  .section-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    margin-bottom: 18px;
    overflow: hidden;
  }

  .section-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    background: var(--bg-surface);
  }
  .section-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
  }
  .section-count {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--border-light);
    padding: 2px 8px;
    border-radius: 999px;

    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;

    margin: 0 0 10px;

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .kv {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 10px 14px;

    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .v {
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }

  /* Table styling */
  .data-table-wrap, .table-wrap {
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);

  }
  table {

    border-collapse: collapse;
    font-size: 13px;

  th {

  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background-color: var(--bg-surface); }

  .list-box, .paragraph-box {
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .list-box ul {
    margin: 6px 0 0 20px;
    padding: 0;
  }
  .raw-content {
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 12px;
    background: var(--bg-surface);
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .badge.ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .badge.bad {
    background: var(--bad-soft);
    color: var(--bad);
  }
  .badge.mdonly {
    background: var(--primary-soft);
    color: #60a5fa;
  }
  .badge.none {
    background: var(--border-light);
    color: var(--text-muted);
  }

  .app-footer {
    padding: 24px 40px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 12px;

  .app-footer strong {

    color: var(--text-primary);

    .cards { grid-template-columns: 1fr 1fr; }
